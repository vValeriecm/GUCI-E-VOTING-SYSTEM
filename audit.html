<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audit Logs | GUCI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="min-h-screen bg-slate-50 flex flex-col font-sans">
    <header class="bg-white border-b border-slate-200 px-8 py-4 sticky top-0 z-10">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-4">
                <a href="admin.html" class="p-2 hover:bg-slate-100 rounded-full transition-colors">
                    <i data-lucide="chevron-left" class="w-6 h-6 text-slate-600"></i>
                </a>
                <div class="flex items-center gap-3">
                    <i data-lucide="shield" class="w-6 h-6 text-blue-600"></i>
                    <h1 class="text-xl font-bold text-slate-900">Security & Audit Logs</h1>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto w-full p-8">
        <div class="bg-white rounded-3xl shadow-sm border border-slate-200 overflow-hidden">
            <table class="w-full text-left">
                <thead class="bg-slate-50 border-b border-slate-200 text-xs font-bold text-slate-400 uppercase tracking-widest">
                    <tr>
                        <th class="px-6 py-4">Action</th>
                        <th class="px-6 py-4">User</th>
                        <th class="px-6 py-4">Timestamp</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-slate-100">
                    <tr>
                        <td class="px-6 py-4 font-bold text-sm">VOTE_CAST</td>
                        <td class="px-6 py-4 text-sm text-slate-600">Student #***456</td>
                        <td class="px-6 py-4 text-sm text-slate-500">2025-06-01 14:22:10</td>
                    </tr>
                    <tr>
                        <td class="px-6 py-4 font-bold text-sm">ADMIN_LOGIN</td>
                        <td class="px-6 py-4 text-sm text-slate-600">Admin (System)</td>
                        <td class="px-6 py-4 text-sm text-slate-500">2025-06-01 13:05:22</td>
                    </tr>
                    <tr>
                        <td class="px-6 py-4 font-bold text-sm">ELECTION_CREATED</td>
                        <td class="px-6 py-4 text-sm text-slate-600">Admin (System)</td>
                        <td class="px-6 py-4 text-sm text-slate-500">2025-06-01 11:45:00</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>
    <script>lucide.createIcons();</script>
</body>
</html>
