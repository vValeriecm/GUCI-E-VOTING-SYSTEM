<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | GUCI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="min-h-screen bg-slate-50 flex items-center justify-center p-6 font-sans">
    <div id="login-container" class="max-w-md w-full bg-white rounded-2xl shadow-xl border border-slate-200 overflow-hidden">
        <div class="bg-blue-600 p-8 text-center text-white">
            <i data-lucide="shield" class="w-12 h-12 mx-auto mb-4"></i>
            <h1 class="text-2xl font-bold">Welcome to GUCI</h1>
            <p class="text-blue-100 mt-2">Secure Student E-Voting System</p>
        </div>

        <div class="p-8">
            <div id="password-login">
                <form id="login-form" class="space-y-6">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-2">Student ID or Email</label>
                        <div class="relative">
                            <i data-lucide="user" class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-slate-400"></i>
                            <input type="text" id="student-id" required class="w-full pl-11 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all" placeholder="e.g. 202100123">
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-2">Password</label>
                        <div class="relative">
                            <i data-lucide="lock" class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-slate-400"></i>
                            <input type="password" id="password" required class="w-full pl-11 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all" placeholder="••••••••">
                        </div>
                    </div>
                    <button type="submit" class="w-full bg-blue-600 text-white py-3 rounded-xl font-bold hover:bg-blue-700 transition-all flex items-center justify-center gap-2">
                        Sign In <i data-lucide="arrow-right" class="w-5 h-5"></i>
                    </button>
                    <div class="relative py-4">
                        <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-slate-200"></div></div>
                        <div class="relative flex justify-center text-xs uppercase"><span class="bg-white px-2 text-slate-500 font-medium">Or</span></div>
                    </div>
                    <button type="button" id="face-id-btn" class="w-full bg-slate-900 text-white py-3 rounded-xl font-bold hover:bg-slate-800 transition-all flex items-center justify-center gap-2">
                        <i data-lucide="camera" class="w-5 h-5"></i> Face Recognition
                    </button>
                </form>
            </div>

            <div id="face-login" class="hidden space-y-6 text-center">
                <div class="relative rounded-2xl overflow-hidden border-2 border-blue-500 bg-black aspect-video flex items-center justify-center">
                    <video id="webcam" autoplay playsinline class="w-full h-full object-cover"></video>
                    <div id="analyzing-overlay" class="hidden absolute inset-0 bg-blue-600/20 backdrop-blur-sm flex flex-col items-center justify-center text-white">
                        <i data-lucide="loader-2" class="w-12 h-12 animate-spin mb-4"></i>
                        <p class="font-bold">Analyzing Face...</p>
                    </div>
                </div>
                <button id="capture-btn" class="w-full bg-blue-600 text-white py-3 rounded-xl font-bold hover:bg-blue-700">Confirm Identity</button>
                <button id="back-to-pw" class="w-full text-slate-500 py-2 text-sm font-medium hover:text-slate-800">Back</button>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();
        const pwLogin = document.getElementById('password-login');
        const faceLogin = document.getElementById('face-login');
        const faceIdBtn = document.getElementById('face-id-btn');
        const webcam = document.getElementById('webcam');
        const captureBtn = document.getElementById('capture-btn');
        const overlay = document.getElementById('analyzing-overlay');

        faceIdBtn.addEventListener('click', async () => {
            pwLogin.classList.add('hidden');
            faceLogin.classList.remove('hidden');
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                webcam.srcObject = stream;
            } catch (err) {
                alert("Camera access denied");
                faceLogin.classList.add('hidden');
                pwLogin.classList.remove('hidden');
            }
        });

        document.getElementById('login-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const id = document.getElementById('student-id').value;
            window.location.href = id === 'admin' ? 'admin.html' : 'student.html';
        });

        captureBtn.addEventListener('click', () => {
            overlay.classList.remove('hidden');
            setTimeout(() => window.location.href = 'student.html', 2000);
        });
    </script>
</body>
</html>
