<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | GUCI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="min-h-screen bg-slate-50 flex font-sans">
    <aside class="w-64 bg-slate-900 text-slate-300 flex flex-col">
        <div class="p-6 border-b border-slate-800 flex items-center gap-2">
            <i data-lucide="vote" class="w-8 h-8 text-blue-500"></i>
            <span class="text-2xl font-bold text-white">GUCI</span>
        </div>
        <nav class="p-4 space-y-1">
            <a href="admin.html" class="flex items-center gap-3 px-4 py-3 bg-blue-600 text-white rounded-xl font-medium">
                <i data-lucide="activity" class="w-5 h-5"></i> Dashboard
            </a>
            <a href="results.html" class="flex items-center gap-3 px-4 py-3 hover:bg-slate-800 rounded-xl">
                <i data-lucide="bar-chart-3" class="w-5 h-5"></i> Analytics
            </a>
            <a href="audit.html" class="flex items-center gap-3 px-4 py-3 hover:bg-slate-800 rounded-xl">
                <i data-lucide="file-text" class="w-5 h-5"></i> Audit Logs
            </a>
        </nav>
    </aside>

    <main class="flex-1 p-10">
        <h2 class="text-3xl font-extrabold text-slate-900 mb-8">Admin Control Center</h2>
        <div class="grid grid-cols-3 gap-6 mb-10">
            <div class="bg-white p-6 rounded-2xl shadow-sm border">
                <p class="text-slate-500 text-sm font-medium">Total Votes Cast</p>
                <h3 class="text-2xl font-bold">4,281</h3>
            </div>
            <div class="bg-white p-6 rounded-2xl shadow-sm border">
                <p class="text-slate-500 text-sm font-medium">Avg. Turnout</p>
                <h3 class="text-2xl font-bold text-green-600">51.4%</h3>
            </div>
        </div>
        <div class="bg-white rounded-2xl shadow-sm border overflow-hidden">
            <table class="w-full text-left">
                <thead class="bg-slate-50 border-b"><tr class="text-xs font-bold text-slate-400 uppercase">
                    <th class="px-6 py-4">Election Name</th>
                    <th class="px-6 py-4">Status</th>
                    <th class="px-6 py-4 text-right">Action</th>
                </tr></thead>
                <tbody><tr class="border-b">
                    <td class="px-6 py-4 font-bold">Student Union President 2025</td>
                    <td class="px-6 py-4 text-green-600 font-bold">Active</td>
                    <td class="px-6 py-4 text-right"><a href="results.html" class="text-blue-600 font-bold hover:underline">View Results</a></td>
                </tr></tbody>
            </table>
        </div>
    </main>
    <script>lucide.createIcons();</script>
</body>
</html>
