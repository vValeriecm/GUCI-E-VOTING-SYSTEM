<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | GUCI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="min-h-screen bg-slate-50 flex items-center justify-center p-6 font-sans">
    <div id="login-container" class="max-w-md w-full bg-white rounded-2xl shadow-xl border border-slate-200 overflow-hidden">
        <div class="bg-blue-600 p-8 text-center text-white">
            <i data-lucide="shield" class="w-12 h-12 mx-auto mb-4"></i>
            <h1 class="text-2xl font-bold">Welcome to GUCI</h1>
            <p class="text-blue-100 mt-2">Secure Student E-Voting System</p>
        </div>

        <div class="p-8">
            <div id="password-login">
                <form id="login-form" class="space-y-6">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-2">Student ID or Email</label>
                        <div class="relative">
                            <i data-lucide="user" class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-slate-400"></i>
                            <input type="text" id="student-id" required class="w-full pl-11 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all" placeholder="e.g. STU001">
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-2">Password</label>
                        <div class="relative">
                            <i data-lucide="lock" class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-slate-400"></i>
                            <input type="password" id="password" required class="w-full pl-11 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all" placeholder="••••••••">
                        </div>
                    </div>

                    <div id="error-msg" class="text-red-500 text-sm hidden p-3 bg-red-50 rounded-lg border border-red-100"></div>

                    <button type="submit" id="submit-btn" class="w-full bg-blue-600 text-white py-3 rounded-xl font-bold hover:bg-blue-700 transition-all flex items-center justify-center gap-2">
                        Sign In <i data-lucide="arrow-right" class="w-5 h-5"></i>
                    </button>

                    <div class="grid grid-cols-2 gap-4">
                        <button type="button" id="face-id-btn" class="bg-slate-900 text-white py-3 rounded-xl font-bold hover:bg-slate-800 transition-all flex items-center justify-center gap-2 text-sm">
                            <i data-lucide="camera" class="w-4 h-4"></i> Face
                        </button>
                        <button type="button" id="fingerprint-btn" class="bg-slate-900 text-white py-3 rounded-xl font-bold hover:bg-slate-800 transition-all flex items-center justify-center gap-2 text-sm">
                            <i data-lucide="fingerprint" class="w-4 h-4"></i> Fingerprint
                        </button>
                    </div>
                </form>
            </div>

            <div id="biometric-login" class="hidden space-y-6 text-center">
                <div id="bio-display" class="relative rounded-2xl overflow-hidden border-2 border-blue-500 bg-slate-100 aspect-video flex flex-col items-center justify-center">
                    <div id="face-view" class="hidden w-full h-full"><video id="webcam" autoplay playsinline class="w-full h-full object-cover"></video></div>
                    <div id="finger-view" class="hidden flex flex-col items-center">
                        <i data-lucide="fingerprint" class="w-20 h-20 text-blue-600 mb-2 animate-pulse"></i>
                        <p class="text-slate-600 font-medium">Place your finger on the sensor</p>
                    </div>
                    <div id="analyzing-overlay" class="hidden absolute inset-0 bg-blue-600/20 backdrop-blur-sm flex flex-col items-center justify-center text-white">
                        <i data-lucide="loader-2" class="w-12 h-12 animate-spin mb-4"></i>
                        <p class="font-bold">Verifying Biometrics...</p>
                    </div>
                </div>
                <button id="bio-confirm-btn" class="w-full bg-blue-600 text-white py-3 rounded-xl font-bold hover:bg-blue-700">Confirm Identity</button>
                <button id="back-to-pw" class="w-full text-slate-500 py-2 text-sm font-medium hover:text-slate-800">Back to Password</button>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();
        const pwLogin = document.getElementById('password-login');
        const bioLogin = document.getElementById('biometric-login');
        const faceIdBtn = document.getElementById('face-id-btn');
        const fingerprintBtn = document.getElementById('fingerprint-btn');
        const webcam = document.getElementById('webcam');
        const overlay = document.getElementById('analyzing-overlay');
        const errorMsg = document.getElementById('error-msg');
        const submitBtn = document.getElementById('submit-btn');

        faceIdBtn.addEventListener('click', async () => {
            pwLogin.classList.add('hidden');
            bioLogin.classList.remove('hidden');
            document.getElementById('face-view').classList.remove('hidden');
            document.getElementById('finger-view').classList.add('hidden');
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                webcam.srcObject = stream;
            } catch (err) {
                alert("Camera access denied");
                goBack();
            }
        });

        fingerprintBtn.addEventListener('click', () => {
            pwLogin.classList.add('hidden');
            bioLogin.classList.remove('hidden');
            document.getElementById('finger-view').classList.remove('hidden');
            document.getElementById('face-view').classList.add('hidden');
        });

        function goBack() {
            bioLogin.classList.add('hidden');
            pwLogin.classList.remove('hidden');
            if (webcam.srcObject) {
                webcam.srcObject.getTracks().forEach(track => track.stop());
                webcam.srcObject = null;
            }
        }

        document.getElementById('back-to-pw').addEventListener('click', goBack);

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const studentId = document.getElementById('student-id').value;
            const password = document.getElementById('password').value;

            errorMsg.classList.add('hidden');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i data-lucide="loader-2" class="w-5 h-5 animate-spin"></i> Signing in...';
            lucide.createIcons();

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ studentId, password })
                });
                const data = await response.json();
                if (response.ok) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    window.location.href = data.user.role === 'student' ? 'student.html' : 'admin.html';
                } else {
                    errorMsg.textContent = data.error;
                    errorMsg.classList.remove('hidden');
                }
            } catch (err) {
                errorMsg.textContent = 'Network error. Please try again.';
                errorMsg.classList.remove('hidden');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = 'Sign In <i data-lucide="arrow-right" class="w-5 h-5"></i>';
                lucide.createIcons();
            }
        });

        document.getElementById('bio-confirm-btn').addEventListener('click', () => {
            overlay.classList.remove('hidden');
            setTimeout(() => {
                alert("Biometric verification demo: identity confirmed. Please use password login to enter the system.");
                overlay.classList.add('hidden');
                goBack();
            }, 2000);
        });
    </script>
</body>
</html>
