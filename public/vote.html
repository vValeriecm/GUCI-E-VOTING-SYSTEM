<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voting Booth | GUCI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="min-h-screen bg-slate-50 flex flex-col font-sans">
    <header class="bg-white border-b border-slate-200 px-6 py-4 flex items-center justify-between sticky top-0 z-10">
        <div class="flex items-center gap-4">
            <a href="student.html"><i data-lucide="chevron-left" class="w-6 h-6 text-slate-600"></i></a>
            <h1 class="font-bold text-slate-900">Student Union President 2025</h1>
        </div>
    </header>

    <div id="voting-content" class="flex-1 max-w-5xl mx-auto w-full px-6 py-10 text-center">
        <h2 class="text-2xl font-extrabold text-slate-900 mb-10">Select Your Candidate</h2>
        <div class="grid md:grid-cols-2 gap-8">
            <div onclick="selectCandidate('Sarah Jenkins')" class="bg-white p-6 rounded-2xl border-2 border-slate-100 hover:border-blue-600 cursor-pointer shadow-sm transition-all">
                <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=150&h=150&fit=crop" class="w-24 h-24 rounded-full mx-auto mb-4 object-cover">
                <h3 class="font-bold text-slate-900 text-lg">Sarah Jenkins</h3>
                <p class="text-blue-600 text-sm">Computer Science</p>
            </div>
            <div onclick="selectCandidate('Michael Chen')" class="bg-white p-6 rounded-2xl border-2 border-slate-100 hover:border-blue-600 cursor-pointer shadow-sm transition-all">
                <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=150&h=150&fit=crop" class="w-24 h-24 rounded-full mx-auto mb-4 object-cover">
                <h3 class="font-bold text-slate-900 text-lg">Michael Chen</h3>
                <p class="text-blue-600 text-sm">Engineering</p>
            </div>
        </div>
        <button id="finalize-btn" disabled class="mt-12 px-10 py-4 bg-slate-900 text-white rounded-2xl font-bold opacity-30">Review & Cast Vote</button>
    </div>

    <script>
        lucide.createIcons();
        let selected = null;
        function selectCandidate(name) {
            selected = name;
            document.getElementById('finalize-btn').disabled = false;
            document.getElementById('finalize-btn').classList.remove('opacity-30');
            document.getElementById('finalize-btn').onclick = () => {
                if(confirm("Confirm your vote for " + name + "?")) {
                    alert("Vote Cast Successfully!");
                    window.location.href = 'student.html';
                }
            };
        }
    </script>
</body>
</html>
